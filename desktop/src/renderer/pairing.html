<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pair this computer — OnOffMyPC</title>
<style>
  :root {
    --background: hsl(240 10% 3.9%);
    --foreground: hsl(0 0% 98%);
    --card: hsl(240 10% 10%);
    --card-foreground: hsl(0 0% 98%);
    --primary: hsl(142 76% 36%);
    --primary-foreground: hsl(355.7 100% 97.3%);
    --muted: hsl(240 5% 64.9%);
    --border: hsl(240 3.7% 15.9%);
    --input: hsl(240 3.7% 15.9%);
    --ring: hsl(142 76% 36%);
    --radius: 0.5rem;
  }

  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--background);
    color: var(--foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  main {
    width: 290px;
    text-align: center;
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background-color: var(--card);
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 0.5rem 0;
    color: var(--foreground);
  }

  p.description {
    color: var(--muted);
    font-size: 0.825rem;
    line-height: 1.35;
    margin: 0 0 1.25rem 0;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-align: center;
    text-transform: uppercase;
    padding: 0.625rem;
    margin-bottom: 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background-color: var(--background);
    color: var(--foreground);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 2px hsla(142, 76%, 36%, 0.2);
  }

  button {
    width: 100%;
    padding: 0.625rem;
    border-radius: var(--radius);
    border: none;
    background-color: var(--primary);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover:not(:disabled) {
    background-color: hsl(142 71% 45%);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #status {
    min-height: 1.25rem;
    margin-top: 1rem;
    font-size: 0.8rem;
    font-weight: 500;
    line-height: 1.25;
  }

  #status.error {
    color: hsl(0 84.2% 60.2%);
  }

  #status.ok {
    color: hsl(142.1 76.2% 36.3%);
  }
</style>
</head>
<body>
<main>
  <h1>Pair this computer</h1>
  <p class="description">Enter the 8-digit pairing code shown when choosing “Add device” on the web dashboard or mobile app.</p>
  <input id="code" maxlength="9" autofocus placeholder="XXXX-XXXX" />
  <button id="submit">Pair Device</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="./pairing.js"></script>
</body>
</html>
