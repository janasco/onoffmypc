name: Firmware CI

# Path-filtered to the firmware component. Before the repository
# consolidation this lived in firmware/.github/workflows/; GitHub only reads
# workflows from the repository root, so it moved here and gained a
# working-directory.

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-ci.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate offline portal contract
        run: python3 tools/check_portal.py

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Run native tests
        run: pio test -e native

      - name: Compile ESP32 firmware
        run: pio run -e esp32dev
