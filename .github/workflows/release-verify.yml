name: Verify release build

# Manual dry-run: builds a SIGNED release APK using the release secrets and
# verifies the signature with apksigner — without publishing anything. Use this
# to confirm signing works before cutting an app-v* release tag.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "APK: $APK"
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Signature OK"
