name: Mobile hardening checks

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-hardening.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-hardening.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Manifest, TLS, storage, and privacy invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check mobile hardening invariants
        run: node mobile/scripts/check-mobile-hardening.mjs
