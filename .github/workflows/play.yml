name: Upload to Google Play

# Builds a signed AAB and uploads it to a Google Play track via the Play Developer
# API. Manual (workflow_dispatch) so uploads are always deliberate — pick the
# track and release status when you run it.
#
# Requires repo secrets (in addition to the keystore secrets used by release.yml):
#   PLAY_SERVICE_ACCOUNT_JSON  — a Google Cloud service-account JSON key that has
#                                been granted release access in Play Console.
# See PLAYSTORE.md ("Automated uploads") for the one-time setup. The very first
# release must be created + uploaded manually before the API will accept uploads.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Release status
        type: choice
        default: completed
        options: [completed, draft, inProgress, halted]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Pin the platform Google Play requires (targetSdk 36 / Android 16).
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.onoffmypc.android
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          whatsNewDirectory: distribution/whatsnew
