name: Mobile (Android) CI

# Path-filtered to the Android component. Moved from mobile/.github/workflows/
# during the repository consolidation (GitHub only reads workflows from the
# repository root).

on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Pin the SDK platform the build targets so a runner image change can
      # never compile against a different API level than the manifest claims.
      # Google Play requires targetSdk 36 (Android 16) from 31 Aug 2026.
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug (no signing secrets needed)
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest :shared:model:test --no-daemon --stacktrace
