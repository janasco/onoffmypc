name: Mobile (Android) CI

# Path-filtered to the Android component. Moved from mobile/.github/workflows/
# during the repository consolidation (GitHub only reads workflows from the
# repository root).

on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # Pin the SDK platform the build targets so a runner image change can
      # never compile against a different API level than the manifest claims.
      # Google Play requires targetSdk 36 (Android 16) from 31 Aug 2026.
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug (no signing secrets needed)
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest :shared:model:test --no-daemon --stacktrace
