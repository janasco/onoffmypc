name: Design system CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate generated artifacts
        run: pnpm check
      - name: Test build and consumer tooling with standalone fixtures
        run: pnpm test
      - run: pnpm build
      - name: Generated output is committed
        run: git diff --exit-code
