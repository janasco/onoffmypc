name: Web CI

# Path-filtered to the web component. Moved from web/.github/workflows/ during
# the repository consolidation (GitHub only reads workflows from the repository
# root).
#
# The web app was extracted from a pnpm workspace, so it now carries its own
# pnpm-lock.yaml and is installed as a standalone package.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies (reproducible, from the committed lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # The build is last: it is the slowest gate, and everything it would
      # catch has already been checked — the value is that a merge is blocked
      # if the web app stops building.
      - name: Build
        run: npm run build
