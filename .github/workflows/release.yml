name: Release firmware

# On a firmware version tag (prefixed 'fw-v' so it doesn't collide with the
# Android app's 'app-v' tags in the shared release repo):
#   - Clean tag  fw-vX.Y.Z        full release: build -> publish -> update web flasher -> deploy
#   - Pre-release fw-vX.Y.Z-rc1   rehearsal:   build -> publish GitHub pre-release ONLY
#     (a hyphen after the version marks a pre-release; the web flasher and marketing
#      site are left untouched, so you can exercise the whole build+publish path safely)
#
# The tag's base version (before any '-suffix') must match FIRMWARE_VERSION in
# src/main.cpp; this is checked first, before the build, so bad tags fail fast.
#
# Required repository secrets:
#   RELEASE_REPO_TOKEN     PAT with contents:write on onoffmypc/onoffmypc-release
#   WEB_REPO_TOKEN         PAT with contents:write on onoffmypc/onoffmypc-web
#   CLOUDFLARE_API_TOKEN   Cloudflare token with Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id

on:
  push:
    tags: ['fw-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and release type
        run: |
          TAG="${GITHUB_REF_NAME}"
          FW="$(grep -oE '#define FIRMWARE_VERSION "[^"]+"' src/main.cpp | sed -E 's/.*"([^"]+)".*/\1/')"
          REST="${TAG#fw-v}"   # strip the fw-v prefix -> "1.3.0" or "1.3.0-rc1"
          case "$REST" in
            *-*) PRERELEASE=true;  BASE="${REST%%-*}" ;;
            *)   PRERELEASE=false; BASE="$REST" ;;
          esac
          if [ "$BASE" != "$FW" ]; then
            echo "::error::Tag $TAG (base $BASE) does not match FIRMWARE_VERSION $FW"
            exit 1
          fi
          echo "VERSION=$FW" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "Tag $TAG -> version $FW, prerelease=$PRERELEASE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Build release artifacts
        run: ./tools/release.sh

      - name: Publish GitHub Release (public release repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          FLAG=""
          [ "${PRERELEASE}" = "true" ] && FLAG="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            --repo onoffmypc/onoffmypc-release \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            $FLAG \
            "dist/onoffmypc-firmware-${VERSION}.bin" \
            "dist/onoffmypc-firmware-${VERSION}-app.bin" \
            "dist/SHA256SUMS-${VERSION}.txt"

      - name: Update web flasher (manifest + binary)
        if: env.PRERELEASE == 'false'
        env:
          WEB_REPO_TOKEN: ${{ secrets.WEB_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${WEB_REPO_TOKEN}@github.com/onoffmypc/onoffmypc-web.git" web
          cd web
          rm -f firmware/onoffmypc-firmware-*.bin
          cp "../dist/onoffmypc-firmware-${VERSION}.bin" firmware/
          cp ../dist/manifest.json firmware/manifest.json
          git config user.name  "onoffmypc"
          git config user.email "github@onoffmypc.com"
          if git diff --quiet; then
            echo "web flasher already up to date"
          else
            git add firmware
            git commit -m "chore: update flasher to firmware v${VERSION}"
            git push
          fi

      - name: Deploy marketing site
        if: env.PRERELEASE == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd web
          npx --yes wrangler@latest pages deploy . --project-name onoffmypc-web --branch main
