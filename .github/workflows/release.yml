name: Release APK

# On an app version tag (app-vX.Y.Z), build a signed release APK and publish it
# to the shared public release repo onoffmypc/onoffmypc-release (which also hosts
# the firmware binaries). App tags are prefixed 'app-v' so they don't collide
# with the firmware's 'fw-v' tags. The tag's version must match versionName in
# app/build.gradle.kts (checked first, so a mismatched tag fails fast).
#
# Required repository secrets:
#   RELEASE_REPO_TOKEN       PAT with contents:write on onoffmypc/onoffmypc-release
#   ANDROID_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD        keystore password
#   KEY_ALIAS                key alias
#   KEY_PASSWORD             key password
# See RELEASE.md for how to generate the keystore and set these.

on:
  push:
    tags: ['app-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          APP_VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match versionName $APP_VERSION"
            exit 1
          fi
          echo "VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build release notes from CHANGELOG
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          bash scripts/release-notes.sh "$VERSION" > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            echo "OnOffMyPC Android ${VERSION}." > "$NOTES"
          fi
          printf '\n---\nInstall on a device with "Install unknown apps" enabled.\n' >> "$NOTES"
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
          echo "----- release notes -----"; cat "$NOTES"

      - name: Publish to the release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" "onoffmypc-android-${VERSION}.apk"
          gh release create "${GITHUB_REF_NAME}" \
            --repo onoffmypc/onoffmypc-release \
            --title "Android ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            "onoffmypc-android-${VERSION}.apk"
