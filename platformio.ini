[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  gilmaimon/ArduinoWebsockets @ ^0.5.3
  bblanchon/ArduinoJson @ ^7.2.0
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
build_flags = -std=c++17
