# XcodeGen spec — generates OnOffMyPC.xcodeproj (never committed).
# On a Mac:  brew install xcodegen && cd ios && xcodegen generate && open OnOffMyPC.xcodeproj
name: OnOffMyPC
options:
  bundleIdPrefix: com.onoffmypc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # set your Apple ID team in Xcode for on-device runs
targets:
  OnOffMyPC:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    sources:
      - path: OnOffMyPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onoffmypc.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: OnOffMyPC/Info.plist
      properties:
        CFBundleDisplayName: OnOffMyPC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  OnOffMyPC:
    build:
      targets:
        OnOffMyPC: all
    run:
      config: Debug
