name: CI

# Compiles the app on every push/PR so build breakages surface immediately
# (no signing secrets needed — debug build).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Pin the SDK platform the build targets so a runner image change can
      # never compile against a different API level than the manifest claims.
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
