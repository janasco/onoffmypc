<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" font-family="DejaVu Sans">
  <rect width="1080" height="1920" fill="#0F0F0F"/>
  <text x="48" y="60" font-size="30" fill="#888888">9:41</text>
  <text x="1032" y="60" font-size="30" fill="#888888" text-anchor="end">5G  100%</text>

  <!-- top bar -->
  <text x="44" y="150" font-size="52" fill="#F0F0F0">←</text>
  <text x="110" y="150" font-size="48" font-weight="bold" fill="#F0F0F0">Gaming PC</text>
  <circle cx="66" cy="222" r="10" fill="#22C55E"/>
  <text x="90" y="236" font-size="32" fill="#22C55E">Online</text>
  <text x="240" y="236" font-size="32" fill="#888888">•  Firmware 1.3.0</text>

  <!-- stat cards -->
  <g font-family="DejaVu Sans">
    <!-- row 1 -->
    <rect x="40"  y="280" width="490" height="170" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="72" y="336" font-size="28" fill="#888888">PC State</text>
    <text x="72" y="410" font-size="56" font-weight="bold" fill="#22C55E">On</text>
    <rect x="550" y="280" width="490" height="170" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="582" y="336" font-size="28" fill="#888888">Temperature</text>
    <text x="582" y="410" font-size="56" font-weight="bold" fill="#F0F0F0">42.5°C</text>
    <!-- row 2 -->
    <rect x="40"  y="470" width="490" height="170" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="72" y="526" font-size="28" fill="#888888">Humidity</text>
    <text x="72" y="600" font-size="56" font-weight="bold" fill="#F0F0F0">38%</text>
    <rect x="550" y="470" width="490" height="170" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="582" y="526" font-size="28" fill="#888888">Signal</text>
    <text x="582" y="600" font-size="56" font-weight="bold" fill="#F0F0F0">-58 dBm</text>
    <!-- row 3 -->
    <rect x="40"  y="660" width="1000" height="150" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="72" y="716" font-size="28" fill="#888888">Last Update</text>
    <text x="72" y="780" font-size="48" font-weight="bold" fill="#F0F0F0">8s ago</text>
  </g>

  <!-- power controls -->
  <rect x="40"  y="860" width="490" height="130" rx="16" fill="#22C55E"/>
  <text x="285" y="942" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Power On</text>
  <rect x="550" y="860" width="490" height="130" rx="16" fill="#EF4444"/>
  <text x="795" y="942" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Power Off</text>
  <rect x="40"  y="1010" width="490" height="130" rx="16" fill="#F59E0B"/>
  <text x="285" y="1092" font-size="40" font-weight="bold" fill="#111111" text-anchor="middle">Force Off</text>
  <rect x="550" y="1010" width="490" height="130" rx="16" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
  <text x="795" y="1092" font-size="40" font-weight="bold" fill="#F0F0F0" text-anchor="middle">Reset</text>

  <!-- chart -->
  <text x="40" y="1250" font-size="34" fill="#888888">Temperature — last 7 days</text>
  <rect x="40" y="1280" width="1000" height="230" rx="20" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/>
  <path d="M90,1440 L230,1395 L370,1415 L510,1350 L650,1370 L790,1305 L930,1335 L990,1320" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="1490" font-size="24" fill="#888888">21.4°C</text>
  <text x="1010" y="1490" font-size="24" fill="#888888" text-anchor="end">43.1°C</text>

  <!-- command history -->
  <text x="40" y="1590" font-size="34" fill="#888888">Command history</text>
  <g font-family="DejaVu Sans">
    <text x="44" y="1660" font-size="38" fill="#F0F0F0">Power On</text>
    <text x="44" y="1700" font-size="26" fill="#888888">Jul 3, 21:14</text>
    <text x="1036" y="1672" font-size="32" fill="#22C55E" text-anchor="end">delivered</text>

    <text x="44" y="1770" font-size="38" fill="#F0F0F0">Reset</text>
    <text x="44" y="1810" font-size="26" fill="#888888">Jul 3, 18:02</text>
    <text x="1036" y="1782" font-size="32" fill="#22C55E" text-anchor="end">delivered</text>

    <text x="44" y="1880" font-size="38" fill="#F0F0F0">Power Off</text>
    <text x="1036" y="1892" font-size="32" fill="#F59E0B" text-anchor="end">pending</text>
  </g>
</svg>
