name: ci

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The monorepo's pnpm-lock.yaml is the single lockfile for every
      # workspace package, so a frozen install here is reproducible and
      # covers apps/web without a second lockfile.
      - uses: pnpm/action-setup@fc06bc1250849d43f0670bf6ae6644d55b4daab0 # v4.1.0
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4
        with:
          node-version: 22

      - name: Install dependencies (reproducible, from the committed lockfile)
        run: pnpm install --frozen-lockfile --filter web

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Unit tests
        run: pnpm --filter web test

      # The build is last: it is the slowest gate, and everything it would
      # catch has already been checked — the value is that a merge is blocked
      # if web stops building.
      - name: Build
        run: pnpm --filter web build
