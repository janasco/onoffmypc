# pnpm configuration for the web app.
#
# In pnpm 11 this file (not .npmrc, and not the "pnpm" field in package.json) is
# where non-auth settings live. `onlyBuiltDependencies` was removed in v11 and
# replaced by `allowBuilds`, a map of package matcher -> true/false.
#
# pnpm 11 refuses to run dependency build scripts unless they are approved and
# exits non-zero with ERR_PNPM_IGNORED_BUILDS (strictDepBuilds defaults to true).
# These two need their native/postinstall steps to run:
#   sharp         — native image encoder used by Next.js image optimisation
#   unrs-resolver — native resolver used by eslint-config-next
#
# Everything else stays denied, so a newly-added dependency with an install
# script fails the build until someone reviews and allows it here.
allowBuilds:
  sharp: true
  unrs-resolver: true
