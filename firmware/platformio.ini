[env:esp32dev]
# Pinned: espressif32 7.x moved to ESP-IDF 5, whose esp_task_wdt API differs
# from 4.x. An unpinned platform means a rebuild can silently change toolchain
# and break, which is exactly what happened — the firmware stopped compiling
# against the newer platform without any source change.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  gilmaimon/ArduinoWebsockets @ ^0.5.3
  bblanchon/ArduinoJson @ ^7.2.0
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
build_flags = -std=c++17
